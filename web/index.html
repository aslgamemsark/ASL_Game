<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- Without this, the self-hosted brand font (index.css) is only discoverable after the CSS
         itself finishes fetching and parsing, guaranteeing a swap flash on every load (found
         2026-07-30). Only the `latin` subset is preloaded — the near-universal case for an
         English-first product; `latin-ext` still loads normally, just not ahead of need. -->
    <link rel="preload" href="/fonts/quicksand-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QuickSign — Learn ASL with Zippy</title>
    <!-- Was "camera never leaves your device" — false once multiplayer exists (Duel/Room stream
         live video to your opponent, see PrivacyPage.tsx and CameraOnboarding.tsx's own fixes for
         the identical claim, 2026-08-30). Scoped to what's actually true of the default, solo
         learning experience this description is selling. -->
    <meta name="description" content="Most apps ask you to recognize a sign. QuickSign watches you make it — and tells you exactly which part to fix. Free, in your browser, camera stays local while you learn." />
    <meta name="theme-color" content="#120B1E" />
    <link rel="canonical" href="https://quicksignn.vercel.app/" />
    <meta name="robots" content="index,follow" />

    <!-- Link previews (Slack/Discord/iMessage/X). og:image reuses landing.html's dedicated
         1200x630 asset (web/public/og-image.png) — correct aspect ratio, no new asset needed
         since it already exists and is already maintained for landing.html. Absolute URLs are
         required by spec, so these hardcode the production origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuickSign" />
    <meta property="og:title" content="QuickSign — Learn to sign. Actually sign." />
    <meta property="og:description" content="Most apps ask you to recognize a sign. QuickSign watches you make it — and tells you exactly which part to fix." />
    <meta property="og:url" content="https://quicksignn.vercel.app/" />
    <meta property="og:image" content="https://quicksignn.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QuickSign: Learn ASL by using your hands, not flashcards — a phone screenshot of the app's home screen with daily quests" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuickSign — Learn to sign. Actually sign." />
    <meta name="twitter:description" content="Most apps ask you to recognize a sign. QuickSign watches you make it — and tells you exactly which part to fix." />
    <meta name="twitter:image" content="https://quicksignn.vercel.app/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "QuickSign",
      "url": "https://quicksignn.vercel.app/",
      "logo": "https://quicksignn.vercel.app/pwa-512x512.png"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "QuickSign",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "Practice American Sign Language with real-time, per-parameter feedback: handshape, palm orientation, location, and movement.",
      "url": "https://quicksignn.vercel.app/",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <!-- Home-screen install (iOS Safari uses these; other browsers read the web manifest the PWA plugin injects). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS reads this exactly once, at launch — unlike <meta name="theme-color"> (synced live to
         the theme in ThemeContext.tsx), it cannot be changed at runtime, so one value has to serve
         both themes. 'black-translucent' draws content edge-to-edge under a translucent status bar
         with light icons/text — correct and premium-looking against the app's DEFAULT dark theme
         (--rt-body-bg #0D0A1E). In light theme those same light status-bar icons sit on a pale
         background (#E7D9FB) with reduced contrast. Accepted tradeoff: the app defaults to dark for
         every new install (getInitialTheme in ThemeContext.tsx), so this is correct for the common
         case; switching to 'default' would fix light-theme contrast but lose the edge-to-edge look
         everyone actually gets. Revisit only if light-theme usage becomes significant. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuickSign" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
