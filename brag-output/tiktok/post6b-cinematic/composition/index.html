<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>QuickSign — Post 6B (Cinematic Hero)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Quicksand'; font-style: normal; font-weight: 300 700; font-display: block;
        src: url('assets/fonts/quicksand-latin.woff2') format('woff2');
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d0a1e; color: #f5f3ff; font-family: 'Quicksand', sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0d0a1e; }
      .clip { position: absolute; inset: 0; }
      .bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(100% 60% at 20% 10%, rgba(124,58,237,0.30), transparent 55%),
          radial-gradient(100% 60% at 85% 95%, rgba(52,211,153,0.14), transparent 55%),
          #0d0a1e;
      }

      /* Cinematic background video: host-root direct child, muted.
         Explicit width/height (not just inset:0) because the renderer's video
         compositing path pastes the source at its native pixel resolution
         unless the box dimensions are set directly — inset:0 alone left a
         720x1280-native clip anchored top-left instead of filling the 1080x1920 canvas. */
      .cine { width: 100%; height: 100%; object-fit: cover; background: #0d0a1e; }
      .scrim-top {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to bottom, rgba(5,3,14,0.75) 0%, rgba(5,3,14,0.15) 30%, transparent 48%);
      }
      .scrim-bottom {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to top, rgba(5,3,14,0.85) 0%, rgba(5,3,14,0.2) 26%, transparent 46%);
      }

      .cap {
        position: absolute; left: 64px; right: 64px; text-align: center;
        font-weight: 700; letter-spacing: -0.01em;
        text-shadow: 0 2px 18px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.7);
      }

      /* Hook beat (0 - 1.3s) */
      .hook-row {
        position: absolute; left: 50%; top: 860px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 26px;
        padding: 30px 40px; border-radius: 28px;
        background: rgba(239,68,68,0.14); border: 2px solid rgba(239,68,68,0.45);
      }
      .hook-ic {
        position: relative; width: 76px; height: 76px; border-radius: 20px;
        display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700;
        background: #ef4444; color: #fff;
      }
      .hook-lbl { font-size: 46px; font-weight: 700; color: #f5f3ff; }
      .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #hook-cap { top: 1420px; font-size: 56px; line-height: 1.2; color: #f5f3ff; }

      /* Checklist mini-card (mid-film catch beat) — shows all 5 sign parameters,
         not just one, so the "catches EVERY fake sign" caption is backed by
         what's actually on screen. */
      .card {
        position: absolute; left: 190px; top: 760px; width: 700px;
        display: flex; flex-direction: column; gap: 18px;
      }
      .row {
        display: flex; align-items: center; gap: 26px;
        padding: 26px 32px; border-radius: 26px;
        background: rgba(34,21,72,0.65); border: 2px solid rgba(255,255,255,0.06);
      }
      .row.g { background: rgba(52,211,153,0.14); border-color: rgba(52,211,153,0.4); }
      .row.r { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.45); }
      .ic {
        position: relative; width: 66px; height: 66px; min-width: 66px; border-radius: 18px;
        display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700;
        background: rgba(76,61,107,0.4);
      }
      .ic.g { background: #34d399; color: #052e1c; }
      .ic.r { background: #ef4444; color: #fff; }
      .lbl { font-size: 40px; font-weight: 700; color: #9c90b0; }
      .lbl.g { color: #34d399; } .lbl.r { color: #f5f3ff; }
      #cap-catch { top: 380px; font-size: 60px; line-height: 1.16; color: #f5f3ff; }

      /* Payoff beat: Zippy celebration */
      .zippy-hero { position: absolute; left: 50%; transform: translateX(-50%); }
      .zippy-hero img { width: 100%; height: 100%; object-fit: contain;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)); }
      #cap-payoff { top: 420px; font-size: 66px; line-height: 1.14; color: #34d399; }
      .confetti-field { position: absolute; left: 50%; top: 55%; width: 0; height: 0; }
      .cf { position: absolute; top: 0; left: 0; width: 22px; height: 32px; border-radius: 5px; opacity: 0; }

      /* Brand end card */
      .endcard-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 70% at 20% 12%, rgba(124,58,237,0.24), transparent 55%),
          radial-gradient(110% 60% at 85% 92%, rgba(20,184,166,0.12), transparent 55%),
          #0d0a1e;
      }
      .endcard { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; }
      .zippy-end { width: 220px; height: 220px; }
      .zippy-end img { width: 100%; height: 100%; object-fit: contain;
        filter: drop-shadow(0 16px 32px rgba(0,0,0,0.4)); }
      .brand-name { font-size: 64px; font-weight: 700; color: #f5f3ff; }
      .brand-sub { font-size: 30px; font-weight: 500; color: #9c90b0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="quicksign-post6b" data-start="0" data-width="1080" data-height="1920" data-duration="13">

      <!-- Beat 1 (0 - 1.3s): hook — payoff teased immediately, not built up to -->
      <section id="hook" class="clip" data-start="0" data-duration="1.3" data-track-index="1">
        <div class="bg"></div>
        <div id="hook-row" class="hook-row" style="opacity:0;">
          <div class="hook-ic"><span class="glyph">✗</span></div>
          <div class="hook-lbl">Palm direction</div>
        </div>
        <div id="hook-cap" class="cap" style="opacity:0;">it actually watches you 👀</div>
      </section>

      <!-- Beat 2 (1.3 - 5.0s): real cinematic footage, no signing — bored, going through flashcards -->
      <video id="shotA" class="clip cine" src="assets/shot-a-flashcards.mp4" data-start="1.3" data-duration="3.7" data-track-index="2" muted playsinline></video>
      <div id="overlay-a" class="clip" data-start="1.3" data-duration="3.7" data-track-index="3">
        <div class="scrim-top"></div>
        <div class="scrim-bottom"></div>
        <div id="cap-flashcards" class="cap" style="top:150px; font-size:62px; line-height:1.16; color:#f5f3ff; opacity:0;">flashcards weren't<br />cutting it</div>
      </div>

      <!-- Beat 3 (5.0 - 8.4s): the real product truth — it catches the mistake -->
      <section id="catch" class="clip" data-start="5.0" data-duration="3.4" data-track-index="1">
        <div class="bg"></div>
        <div id="cap-catch" class="cap" style="opacity:0;">it catches EVERY fake sign</div>
        <div id="card" class="card" style="opacity:0;">
          <div class="row g"><div class="ic g"><span class="glyph">✓</span></div><div class="lbl g">Hand shape</div></div>
          <div class="row g"><div class="ic g"><span class="glyph">✓</span></div><div class="lbl g">Location</div></div>
          <div class="row g"><div class="ic g"><span class="glyph">✓</span></div><div class="lbl g">Movement</div></div>
          <div class="row g"><div class="ic g"><span class="glyph">✓</span></div><div class="lbl g">Expression</div></div>
          <div id="row5" class="row r">
            <div id="ic5" class="ic r">
              <span id="x5" class="glyph" style="opacity:1;">✗</span>
              <span id="c5" class="glyph" style="opacity:0; color:#052e1c;">✓</span>
            </div>
            <div id="lbl5" class="lbl r">Palm direction</div>
          </div>
        </div>
      </section>

      <!-- Beat 4 (8.4 - 11.0s): payoff — the fix lands, Zippy celebrates -->
      <section id="payoff" class="clip" data-start="8.4" data-duration="2.6" data-track-index="1">
        <div class="bg"></div>
        <div id="cap-payoff" class="cap" style="opacity:0;">it won't let you fake it 🤟</div>
        <div id="z-payoff" class="zippy-hero" style="top: 780px; width: 480px; height: 480px; opacity:0;">
          <img src="assets/zippy/celebrating.webp" alt="" />
        </div>
        <div id="confetti-field" class="confetti-field"></div>
      </section>

      <!-- Beat 5 (11.0 - 13.0s): brand end card -->
      <section id="endcard" class="clip" data-start="11.0" data-duration="2.0" data-track-index="1">
        <div class="endcard-bg"></div>
        <div class="endcard">
          <div class="zippy-end"><img id="z-end" src="assets/zippy/thumbsup.webp" alt="Zippy thumbs up" /></div>
          <div class="brand-name">QuickSign</div>
          <div class="brand-sub">free. no downloads. no catch.</div>
        </div>
      </section>

      <!-- Audio -->
      <audio id="bgm" src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3" data-start="0" data-duration="13" data-track-index="10" data-volume="0.07"></audio>
      <audio id="sfx-hook" src="assets/sfx/click_003.ogg" data-start="0.15" data-duration="0.01" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-catch" src="assets/sfx/click_003.ogg" data-start="7.3" data-duration="0.01" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-win" src="assets/sfx/impactBell_heavy_000.ogg" data-start="7.5" data-duration="1" data-track-index="13" data-volume="0.85"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COLORS = ['#34D399','#A78BFA','#5EEAD4','#F97316','#F5F3FF'];
      const VEC = [[-260,-320,-40],[240,-360,30],[-400,-180,-70],[380,-220,60],[-150,-420,20],[170,-400,-30],
        [-320,-90,80],[320,-110,-60],[-60,-450,50],[80,-450,-50],[-380,-260,15],[400,-250,-15]];
      const field = document.getElementById('confetti-field');
      VEC.forEach((v,i)=>{ const p=document.createElement('div'); p.className='cf'; p.id='cf-'+i;
        p.style.background=COLORS[i%COLORS.length]; field.appendChild(p); });

      // ---- Beat 1: hook (0 - 1.3s) — payoff teased before any build-up ----
      tl.fromTo('#hook-row', { autoAlpha: 0, scale: 0.85 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: 'back.out(1.7)' }, 0.1);
      tl.fromTo('#hook-cap', { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.35);
      tl.to('#hook-row, #hook-cap', { autoAlpha: 0, duration: 0.2, ease: 'power2.in' }, 1.15);
      tl.set('#hook-row, #hook-cap', { autoAlpha: 0 }, 1.3);

      // ---- Beat 2: cinematic footage (1.3 - 5.0s) ----
      tl.fromTo('#cap-flashcards', { autoAlpha: 0, y: -16, scale: 0.97 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: 'power4.out' }, 1.85);
      tl.to('#cap-flashcards', { autoAlpha: 0, duration: 0.25, ease: 'power2.in' }, 4.75);
      tl.set('#cap-flashcards', { autoAlpha: 0 }, 5.0);

      // ---- Beat 3: the catch (5.0 - 8.4s) ----
      tl.fromTo('#cap-catch, #card', { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 5.2);
      // shake the red row
      tl.to('#row5', { x: -8, duration: 0.08, repeat: 5, yoyo: true, ease: 'power1.inOut' }, 6.4);
      tl.set('#row5', { x: 0 }, 6.9);
      // fix it — lands with the sfx-catch/sfx-win cue
      tl.to('#ic5', { backgroundColor: '#34d399', duration: 0.2 }, 7.3);
      tl.to('#x5', { autoAlpha: 0, duration: 0.15 }, 7.3);
      tl.to('#c5', { autoAlpha: 1, duration: 0.15 }, 7.3);
      tl.to('#lbl5', { color: '#34d399', duration: 0.2 }, 7.3);
      tl.to('#row5', { backgroundColor: 'rgba(52,211,153,0.14)', borderColor: 'rgba(52,211,153,0.4)', duration: 0.2 }, 7.3);
      tl.to('#cap-catch, #card', { autoAlpha: 0, duration: 0.25, ease: 'power2.in' }, 8.05);

      // ---- Beat 4: payoff (8.4 - 11.0s) ----
      tl.fromTo('#cap-payoff', { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 8.55);
      tl.fromTo('#z-payoff', { autoAlpha: 0, y: 24, scale: 0.8 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.6)' }, 8.7);
      // confetti burst — immediateRender:false avoids painting the "from" state (opacity 1,
      // at rest position) before the timeline reaches this point; see post6a for the bug this fixes.
      VEC.forEach((v,i)=>{ const [dx,dy,rot]=v;
        tl.fromTo('#cf-'+i, { x:0,y:0,rotation:0,opacity:1,scale:0.6 }, { x:dx,y:dy,rotation:rot,opacity:0,scale:1,duration:1.1,ease:'power2.out', immediateRender:false }, 8.75 + (i%4)*0.03); });
      tl.to('#cap-payoff, #z-payoff', { autoAlpha: 0, duration: 0.25, ease: 'power2.in' }, 10.75);
      tl.set('#cap-payoff, #z-payoff', { autoAlpha: 0 }, 11.0);

      // ---- Beat 5: end card entrance ----
      tl.fromTo('#endcard .zippy-end', { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 11.1);
      tl.fromTo('#endcard .brand-name', { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 11.35);
      tl.fromTo('#endcard .brand-sub', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 11.55);

      tl.to('#bgm', { volume: 0, duration: 1.0, ease: 'power1.in' }, 11.8);

      window.__timelines['quicksign-post6b'] = tl;
    </script>
  </body>
</html>
