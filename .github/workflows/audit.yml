name: Dependency audit

# Runs on a schedule instead of gating every PR/push build. A `high` advisory can get published
# for an existing, already-installed transitive dependency at any time — that must not turn the
# build red for a commit that changed nothing (this is exactly what happened to `web`'s CI: 30/30
# runs failed on `npm audit`, unrelated to any code change, and nobody could tell "app broken" from
# "upstream published an advisory today").
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Was 20 — inconsistent with ci.yml's 22, and only survived because this job's own
          # `npm ci && npm run audit` never imports app code (so never hit the native-WebSocket
          # requirement @supabase/realtime-js has from Node 22 on, documented in ci.yml). One
          # `postinstall` script away from reproducing a bug this repo already paid to find.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run audit
