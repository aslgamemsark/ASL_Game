name: CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'core/**'
      - 'signs/**'
      - 'tests/**'
      - 'supabase/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'core/**'
      - 'signs/**'
      - 'tests/**'
      - 'supabase/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  # node-version 22 (not 20) on all three JS jobs below: @supabase/realtime-js constructs its
  # RealtimeClient at module-import time and requires the native `WebSocket` global, which Node
  # only ships from 22 onward. Any test that transitively imports src/lib/supabase.ts under
  # Node 20 fails with "Node.js detected but native WebSocket not found" regardless of what it
  # actually tests. Found 2026-08-04 when this pinned-to-20 CI ran on a PR for the first time —
  # Code_Fix had never been CI-tested before (this workflow only triggers on PRs and pushes to
  # main), so the break shipped straight to production undetected. Also pinned in
  # web/package.json's `engines` field now, so a local `npm install` under the wrong Node warns too.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Ensure uncleared classifier weights are absent from release artifact
        run: test ! -e dist/models/signs/model.json

  # Sign-definition drift gate (round-4 B1): signs/*.py is the source of truth;
  # tools/generate_sign_jsons.py regenerates signs/*.json, and
  # tools/generate_engine_signs.ts regenerates web/src/engine/signs/index.ts.
  # If an edited Python sign was never regenerated through both steps, the
  # committed JSON/TS drifts from the behaviour the Python confusor suite
  # validated while every other gate stays green. This job regenerates both
  # layers and fails on any diff. (Verified locally 2026-08-24: zero drift.)
  sign-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate sign JSONs from Python source of truth
        run: python tools/generate_sign_jsons.py
      - name: Regenerate TypeScript engine signs from JSONs
        run: npx --yes tsx tools/generate_engine_signs.ts
      - name: Fail if anything drifted
        run: |
          git diff --exit-code --ignore-cr-at-eol -- signs/ web/src/engine/signs/ \
            || (echo "::error::Generated sign files are out of date. Run: python tools/generate_sign_jsons.py && npx tsx tools/generate_engine_signs.ts, then commit the result." && exit 1)

  # e2e and multiplayer are pull_request-only (2026-08-30) — they were previously ALSO re-run on
  # every push to main, re-validating the exact commit the PR already validated (this repo merges
  # via PR, so the push-to-main commit is the same tree) at real Docker+Playwright cost for zero
  # new information. Vercel's own deploy is triggered by the push independently of this workflow's
  # result either way, so nothing here gates production. `web` + `python` still run on push as a
  # fast build/lint/unit-test confirmation of the merged state.
  #
  # Deliberately Supabase-UNCONFIGURED (2026-08-30), same as before — do not "fix" this by adding
  # VITE_SUPABASE_URL/ANON_KEY here. A syntactically-valid but unreachable placeholder was tried and
  # reverted: it makes `supabaseReady` true, which makes WorldMap.tsx fire a real
  # `supabase.from('world_flags').select(...)` query the instant Home mounts — against a host that
  # can't resolve, Chromium logs `net::ERR_NAME_NOT_RESOLVED` as a console error, and every spec in
  # mobile.spec.ts that asserts zero console errors goes red. That trades 91 known failures for a
  # smaller set of much more confusing ones. The actual fix is `helpers.ts`'s `completeOnboarding` —
  # it now tolerates the 'auth' step being skipped, the same way `OnboardingFlow.tsx` itself does
  # when Supabase isn't configured, so this job passes against the environment it actually has. The
  # one spec that genuinely requires `supabaseReady === true` (`a11y.spec.ts`'s "onboarding steps",
  # which explicitly scans the auth step) is `test.skip`-guarded here with the precondition stated,
  # rather than silently passing on a step it never rendered.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # All three Playwright projects (chromium, android on chromium, ios on webkit) need their
      # engines installed — installing only chromium here silently skipped the ios project on
      # every run since it was added 2026-07-28, which is why that break was never observed.
      - run: npx playwright install --with-deps
      - run: npm run test:e2e

  # Multiplayer integration suite. Runs against a LOCAL Supabase stack started here in the runner —
  # never the hosted production project. This is the job that makes the suite worth having: it
  # needs Docker, which the Windows dev machine this was authored on does not have, so locally the
  # suite skips with an explanatory message and CI is where it actually executes.
  multiplayer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `start` boots the stack and applies supabase/migrations; `db reset` re-applies them from
      # scratch so a cached container can never leave the schema a migration behind — which would
      # otherwise surface as a confusing mid-test failure rather than a clear one.
      - run: supabase start
      - run: supabase db reset
      - run: npm ci
        working-directory: web
      # Chromium only — the suite is Chromium-only by design (see playwright.multiplayer.config.ts
      # for why fake-media WebRTC across two contexts is not portable to WebKit). Supabase env for
      # this job comes from playwright.multiplayer.config.ts's own webServer.env, pointing at the
      # LOCAL stack started above — the app under test here IS configured, unlike the plain `e2e`
      # job (see its own comment on why that one deliberately stays unconfigured).
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:multiplayer
        working-directory: web
      - name: Stop the local stack
        if: always()
        run: supabase stop

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
